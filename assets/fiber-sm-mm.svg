<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="300" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#0f766e">Single Mode vs Multi Mode Fiber Optic</text>

  <!-- SM -->
  <rect x="30" y="56" width="320" height="150" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">SINGLE MODE (SMF) — jaket kuning</text>
  <circle cx="120" cy="146" r="52" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="120" cy="146" r="30" fill="#fbbf24"/>
  <circle cx="120" cy="146" r="5" fill="#fff7ed"/>
  <text x="120" y="216" text-anchor="middle" font-size="10" fill="#92400e">core ±9 µm (satu berkas cahaya)</text>
  <g font-size="10.5" fill="#475569">
    <text x="196" y="122">• Sumber: <tspan font-weight="800" fill="#b45309">Laser</tspan></text>
    <text x="196" y="146">• Jarak: <tspan font-weight="800" fill="#b45309">100+ km</tspan></text>
    <text x="196" y="170">• Bandwidth: <tspan font-weight="800" fill="#b45309">Tbps</tspan></text>
    <text x="196" y="194">• Pakai: backbone ISP / antar kota</text>
  </g>

  <!-- MM -->
  <rect x="370" y="56" width="320" height="150" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="530" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#0e7490">MULTI MODE (MMF) — jaket aqua/oranye</text>
  <circle cx="460" cy="146" r="52" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
  <circle cx="460" cy="146" r="34" fill="#22d3ee" opacity="0.7"/>
  <g stroke="#0e7490" stroke-width="2" fill="none">
    <path d="M432 122 q28 24 56 0"/><path d="M432 170 q28 -24 56 0"/>
  </g>
  <text x="460" y="216" text-anchor="middle" font-size="10" fill="#0e7490">core 50/62,5 µm (banyak mode cahaya)</text>
  <g font-size="10.5" fill="#475569">
    <text x="526" y="122">• Sumber: <tspan font-weight="800" fill="#0e7490">LED/VCSEL</tspan></text>
    <text x="526" y="146">• Jarak: <tspan font-weight="800" fill="#0e7490">maks 550 m</tspan></text>
    <text x="526" y="170">• Bandwidth: <tspan font-weight="800" fill="#0e7490">10–100 Gbps</tspan></text>
    <text x="526" y="194">• Pakai: data center / kampus</text>
  </g>

  <rect x="30" y="226" width="660" height="54" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="248" text-anchor="middle" font-size="11.5" font-weight="800" fill="#15803d">Prinsip: Total Internal Reflection — cahaya terpantul di dalam core</text>
  <text x="360" y="268" text-anchor="middle" font-size="10.5" fill="#475569">Atenuasi diukur dB/km • SM cocok jarak jauh, MM cocok jarak pendek &amp; lebih murah</text>
</svg>
