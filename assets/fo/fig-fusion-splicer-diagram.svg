<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="760" height="360" rx="16" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" font-size="15.5" font-weight="800" fill="#f8fafc">Prinsip Kerja Core-Alignment Fusion Splicer (Sistem PAS)</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">Peleburan silika murni 1600°C–2000°C menghasilkan sambungan permanen loss ≤ 0.05 dB (standar maks ≤ 0.10 dB)</text>

  <!-- Central schematic chamber -->
  <rect x="34" y="68" width="692" height="176" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Clamp + Stepper Motor -->
  <rect x="64" y="130" width="90" height="52" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="109" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1">Motor X/Y/Z</text>
  <text x="109" y="166" text-anchor="middle" font-size="9" fill="#94a3b8">&amp; Sheath Clamp</text>

  <!-- Left V-Groove -->
  <rect x="180" y="142" width="120" height="34" rx="4" fill="#475569"/>
  <text x="240" y="163" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fde047">V-Groove Zirkonia</text>

  <!-- Right V-Groove -->
  <rect x="460" y="142" width="120" height="34" rx="4" fill="#475569"/>
  <text x="520" y="163" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fde047">V-Groove Zirkonia</text>

  <!-- Right Clamp + Motor -->
  <rect x="606" y="130" width="90" height="52" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="651" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1">Motor X/Y/Z</text>
  <text x="651" y="166" text-anchor="middle" font-size="9" fill="#94a3b8">&amp; Sheath Clamp</text>

  <!-- Fibers left and right meeting in arc gap -->
  <rect x="48" y="151" width="132" height="12" fill="#3b82f6"/>
  <rect x="180" y="154" width="194" height="6" fill="#e0f2fe"/>
  <rect x="386" y="154" width="194" height="6" fill="#e0f2fe"/>
  <rect x="580" y="151" width="132" height="12" fill="#f97316"/>

  <!-- Upper & Lower Electrodes + Electric Arc -->
  <polygon points="374,94 386,94 382,138 378,138" fill="#cbd5e1"/>
  <polygon points="378,176 382,176 386,220 374,220" fill="#cbd5e1"/>
  <circle cx="380" cy="157" r="14" fill="#f97316" opacity="0.55"/>
  <circle cx="380" cy="157" r="7" fill="#fef08a"/>
  <text x="380" y="88" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fb923c">Elektroda Tungsten (± 8000 V / ~1800°C)</text>

  <!-- PAS Camera Lens -->
  <rect x="308" y="84" width="46" height="26" rx="5" fill="#0ea5e9"/>
  <text x="331" y="101" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">Kamera X</text>
  <rect x="406" y="84" width="46" height="26" rx="5" fill="#0ea5e9"/>
  <text x="429" y="101" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">Kamera Y</text>
  <text x="380" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8">PAS (Profile Alignment System) + Uji Tarik Mekanis 200 g</text>

  <!-- 6-Step SOP Strip -->
  <rect x="34" y="256" width="692" height="86" rx="12" fill="#172554" stroke="#3b82f6"/>
  <text x="48" y="278" font-size="12" font-weight="800" fill="#93c5fd">SOP 6 Tahap Wajib Fusion Splicing (Standar Industri):</text>
  <g font-size="10" font-weight="700" fill="#f8fafc">
    <rect x="48" y="290" width="104" height="38" rx="6" fill="#1e40af"/><text x="100" y="307" text-anchor="middle">1. Sleeve Masuk</text><text x="100" y="320" text-anchor="middle" font-size="8.5" fill="#bfdbfe">Sebelum kupas!</text>
    <rect x="160" y="290" width="104" height="38" rx="6" fill="#1e40af"/><text x="212" y="307" text-anchor="middle">2. Strip 3–4 cm</text><text x="212" y="320" text-anchor="middle" font-size="8.5" fill="#bfdbfe">Miller 3-hole ±30°</text>
    <rect x="272" y="290" width="104" height="38" rx="6" fill="#1e40af"/><text x="324" y="307" text-anchor="middle">3. Clean IPA 99%</text><text x="324" y="320" text-anchor="middle" font-size="8.5" fill="#bfdbfe">Tisu lint-free 1× usap</text>
    <rect x="384" y="290" width="104" height="38" rx="6" fill="#1e40af"/><text x="436" y="307" text-anchor="middle">4. Cleave 90°</text><text x="436" y="320" text-anchor="middle" font-size="8.5" fill="#fca5a5">Dilarang lap ulang!</text>
    <rect x="496" y="290" width="104" height="38" rx="6" fill="#1e40af"/><text x="548" y="307" text-anchor="middle">5. Arc Fusion</text><text x="548" y="320" text-anchor="middle" font-size="8.5" fill="#bbf7d0">Cek angle &amp; loss</text>
    <rect x="608" y="290" width="104" height="38" rx="6" fill="#059669"/><text x="660" y="307" text-anchor="middle">6. Heater Shrink</text><text x="660" y="320" text-anchor="middle" font-size="8.5" fill="#d1fae5">180°C + tata tray</text>
  </g>
</svg>
