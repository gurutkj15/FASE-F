<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="760" height="380" rx="16" fill="#0f172a"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#f8fafc">Keselamatan Radiasi Laser (IEC 60825-2) &amp; Penanganan Serpihan Kaca</text>
  <text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#94a3b8">Mengapa teknisi FO dilarang menatap ujung serat dan wajib memakai Kacamata Safety + Wadah Serpihan</text>

  <!-- Spectrum Bar -->
  <rect x="28" y="72" width="440" height="178" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="96" font-size="13" font-weight="700" fill="#fbbf24">1. Spektrum Cahaya: Tampak vs Inframerah Tak Kasat Mata</text>

  <defs>
    <linearGradient id="visSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22c55e"/><stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect x="44" y="114" width="130" height="26" rx="6" fill="url(#visSpec)"/>
  <text x="109" y="131" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">380–750 nm (Tampak)</text>

  <rect x="180" y="114" width="272" height="26" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="316" y="131" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fca5a5">850 · 1310 · 1490 · 1550 · 1625 nm (IR TAK TAMPAK)</text>

  <text x="109" y="158" text-anchor="middle" font-size="10" fill="#cbd5e1">VFL 650 nm merah</text>
  <text x="109" y="171" text-anchor="middle" font-size="9.5" fill="#94a3b8">(Pupil refleks berkedip)</text>

  <text x="316" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#fecaca">SFP / OLT / OTDR / EDFA (Bahaya!)</text>
  <text x="316" y="171" text-anchor="middle" font-size="9.5" fill="#fca5a5">Mata TIDAK berkedip → difokuskan ke retina → luka bakar permanen</text>

  <rect x="44" y="188" width="408" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="56" y="206" font-size="10.5" font-weight="700" fill="#38bdf8">Kelas Bahaya IEC 60825-2:</text>
  <text x="56" y="222" font-size="10" fill="#cbd5e1">• Class 1M: Aman mata telanjang, BERBAHAYA via lup/mikroskop tanpa filter</text>
  <text x="56" y="234" font-size="10" fill="#fca5a5">• Class 3B: Output DWDM / EDFA merusak mata langsung — wajib cek OPM dulu!</text>

  <!-- Fiber Shards Box -->
  <rect x="484" y="72" width="248" height="178" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="608" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">2. Limbah Serpihan Kaca</text>
  <!-- Trash Can Icon -->
  <rect x="574" y="120" width="68" height="72" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
  <rect x="568" y="110" width="80" height="12" rx="4" fill="#dc2626"/>
  <text x="608" y="150" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">FIBER</text>
  <text x="608" y="164" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">SHARDS</text>
  <text x="608" y="178" text-anchor="middle" font-size="9" fill="#fecaca">125 µm</text>
  <text x="608" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#e2e8f0">Tidak terlihat X-Ray medis!</text>
  <text x="608" y="226" text-anchor="middle" font-size="9.5" fill="#94a3b8">Pungut dengan selotip, buang ke</text>
  <text x="608" y="239" text-anchor="middle" font-size="9.5" fill="#94a3b8">wadah tertutup, dilarang makan/minum</text>

  <!-- Manhole / Confined Space Strip -->
  <rect x="28" y="264" width="704" height="96" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="286" font-size="12.5" font-weight="800" fill="#93c5fd">3. Protokol Ruang Terbatas (Manhole) &amp; Ketinggian (Aerial ≥ 1.8 m)</text>
  <g font-size="10.5" fill="#e2e8f0">
    <text x="44" y="308">✓ <tspan font-weight="700" fill="#34d399">Barikade:</tspan> Traffic cone 15–25 m + rompi Hi-Vis (ANSI 107) + helm SNI/ANSI Z89.1</text>
    <text x="44" y="327">✓ <tspan font-weight="700" fill="#34d399">Uji Gas Manhole:</tspan> O₂ ≥ 19.5% · CO &lt; 25 ppm · H₂S &lt; 10 ppm · CH₄ &lt; 10% LEL + blower aktif</text>
    <text x="44" y="346">✓ <tspan font-weight="700" fill="#34d399">Buddy System &amp; Ketinggian:</tspan> Minimal 2 teknisi; tiang wajib Full Body Harness (EN 361) pengait ganda</text>
  </g>
</svg>
