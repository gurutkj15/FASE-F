<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="760" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="30" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0f172a">Anatomi 5 Lapisan Kabel Serat Optik &amp; Standar ITU-T</text>

  <!-- Telescoping horizontal fiber structure -->
  <!-- Outer Jacket -->
  <rect x="46" y="76" width="160" height="108" rx="8" fill="#1e293b"/>
  <!-- Strength Member (Aramid Kevlar / FRP) -->
  <rect x="206" y="88" width="90" height="84" fill="#f59e0b"/>
  <path d="M210 96 L290 104 M210 118 L290 110 M210 142 L290 152 M210 164 L290 158" stroke="#fef3c7" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Buffer / Coating -->
  <rect x="296" y="102" width="105" height="56" fill="#2563eb"/>
  <!-- Cladding -->
  <rect x="401" y="114" width="115" height="32" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <!-- Core -->
  <rect x="516" y="126" width="130" height="8" fill="#38bdf8" stroke="#0284c7" stroke-width="0.8"/>
  <line x1="401" y1="130" x2="646" y2="130" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Callout lines & labels -->
  <g font-size="11" font-weight="700" fill="#0f172a">
    <line x1="126" y1="76" x2="126" y2="54" stroke="#475569"/>
    <text x="126" y="49" text-anchor="middle">Outer Jacket (PE/LSZH)</text>

    <line x1="251" y1="172" x2="251" y2="205" stroke="#d97706"/>
    <text x="251" y="218" text-anchor="middle" fill="#b45309">Strength Member</text>
    <text x="251" y="232" text-anchor="middle" font-size="9.5" font-weight="500" fill="#64748b">Kevlar / FRP / Steel</text>

    <line x1="348" y1="102" x2="348" y2="54" stroke="#2563eb"/>
    <text x="348" y="49" text-anchor="middle" fill="#1d4ed8">Coating 250 µm</text>

    <line x1="458" y1="146" x2="458" y2="205" stroke="#475569"/>
    <text x="458" y="218" text-anchor="middle" fill="#334155">Cladding 125 µm</text>
    <text x="458" y="232" text-anchor="middle" font-size="9.5" font-weight="500" fill="#64748b">Indeks bias n₂ lebih rendah</text>

    <line x1="581" y1="126" x2="581" y2="72" stroke="#0284c7"/>
    <text x="581" y="56" text-anchor="middle" fill="#0369a1">Core: 9 µm (SMF) / 50 µm (MMF)</text>
    <text x="581" y="69" text-anchor="middle" font-size="9.5" font-weight="500" fill="#64748b">Jalur foton cahaya (TIR)</text>
  </g>

  <!-- ITU-T Comparison Strip at bottom -->
  <rect x="28" y="252" width="704" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="274" font-size="12" font-weight="800" fill="#1e3a8a">Klasifikasi Serat Single-Mode Standar Industri (ITU-T)</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="44" y="294"><tspan font-weight="800" fill="#0369a1">• G.652.D (Feeder/Backbone):</tspan> Low Water Peak (1260–1625 nm) · Atenuasi ≤0.35 dB/km @1310, ≤0.22 dB/km @1550 · Radius min <tspan font-weight="700">30 mm</tspan></text>
    <text x="44" y="313"><tspan font-weight="800" fill="#0f766e">• G.657.A1 / A2 (Drop FTTx):</tspan> Bend-Insensitive &amp; kompatibel G.652.D · Radius aman ketat <tspan font-weight="700">10 mm (A1) / 7.5 mm (A2)</tspan></text>
    <text x="44" y="332"><tspan font-weight="800" fill="#7c3aed">• G.657.B3 (Indoor IKR):</tspan> Ultra Bend-Insensitive untuk sudut dinding tajam hingga radius <tspan font-weight="700">5 mm</tspan></text>
  </g>
</svg>
