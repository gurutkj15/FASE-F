  <rect x="30" y="250" width="700" height="52" rx="10" fill="#0f172a"/>
  <text x="380" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">Aturan Pengelompokan Multi-Tube (Contoh Kabel Feeder 24 Core &amp; 48 Core):</text>
  <text x="380" y="290" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Tube 1 (Biru) = Core 1–12 · Tube 2 (Orange) = Core 13–24 · Tube 3 (Hijau) = Core 25–36 · Tube 4 (Cokelat) = Core 37–48</text>
