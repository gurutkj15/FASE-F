  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#64748b">Urutan wajib 1 s/d 12 pada tiap Loose Tube maupun Pigtail Multi-Core ("BOHCA PUMHK PT")</text>

  <!-- Row 1: 1-6 -->
  <g transform="translate(30,68)">
