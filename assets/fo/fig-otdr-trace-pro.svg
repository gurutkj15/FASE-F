<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="760" height="390" rx="16" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" font-size="15.5" font-weight="800" fill="#f8fafc">Cara Membaca Kurva Trace OTDR (Reflective, Splice, Macrobend, Dead Zone &amp; Cut)</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">Sumbu Y = Daya Hamburan Balik (dB) · Sumbu X = Jarak Kabel (km) menggunakan IOR ≈ 1.4677</text>

  <!-- Graph Grid -->
  <rect x="64" y="68" width="664" height="224" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="64" y1="112" x2="728" y2="112"/><line x1="64" y1="156" x2="728" y2="156"/>
    <line x1="64" y1="200" x2="728" y2="200"/><line x1="64" y1="244" x2="728" y2="244"/>
    <line x1="150" y1="68" x2="150" y2="292"/><line x1="270" y1="68" x2="270" y2="292"/>
    <line x1="390" y1="68" x2="390" y2="292"/><line x1="510" y1="68" x2="510" y2="292"/>
    <line x1="630" y1="68" x2="630" y2="292"/>
  </g>

  <!-- Launch Cable Dead Zone shading -->
  <rect x="65" y="69" width="84" height="222" fill="#1e3a8a" opacity="0.28"/>
  <text x="107" y="280" text-anchor="middle" font-size="9" font-weight="700" fill="#93c5fd">Launch Cable 500m</text>

  <!-- Main 1310 nm Backscatter Trace -->
  <polyline points="68,125 74,78 86,125 148,132 154,90 164,138 268,150 274,158 388,172 396,179 496,192 503,144 512,199 612,211 618,108 628,274 720,274"
            fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 1550 nm Bend Comparison dashed line at Event 3 -->
  <polyline points="388,172 396,204 496,216" fill="none" stroke="#f97316" stroke-width="2.2" stroke-dasharray="5 3"/>

  <!-- Event Callouts -->
  <g font-size="9.5" font-weight="700">
    <!-- Dead zone -->
    <text x="108" y="88" text-anchor="middle" fill="#fde047">EDZ/ADZ</text>
    <!-- First network connector -->
    <circle cx="154" cy="90" r="4" fill="#22c55e"/>
    <text x="172" y="92" fill="#86efac">1. Konektor ODF</text>
    <text x="172" y="104" font-size="8.5" font-weight="500" fill="#cbd5e1">(Spike Fresnel)</text>

    <!-- Fusion splice -->
    <circle cx="271" cy="154" r="4" fill="#38bdf8"/>
    <text x="272" y="138" text-anchor="middle" fill="#7dd3fc">2. Fusion Splice</text>
    <text x="272" y="148" text-anchor="middle" font-size="8.5" font-weight="500" fill="#cbd5e1">Tangga ≤ 0.1 dB (non-reflektif)</text>

    <!-- Macrobend -->
    <circle cx="394" cy="198" r="4" fill="#fb923c"/>
    <text x="398" y="230" text-anchor="middle" fill="#fdba74">3. Macro-Bending!</text>
    <text x="398" y="242" text-anchor="middle" font-size="8.5" font-weight="500" fill="#fed7aa">1550 nm turun drastis &gt; 1310 nm</text>

    <!-- Mechanical splice / ODP connector -->
    <circle cx="503" cy="144" r="4" fill="#22c55e"/>
    <text x="504" y="130" text-anchor="middle" fill="#86efac">4. Konektor ODP</text>

    <!-- Fiber Cut / End -->
    <circle cx="618" cy="108" r="5" fill="#ef4444"/>
    <text x="646" y="114" fill="#fca5a5">5. Fiber Cut / End</text>
    <text x="646" y="128" font-size="8.5" font-weight="500" fill="#fecaca">Spike → jatuh ke</text>
    <text x="646" y="140" font-size="8.5" font-weight="500" fill="#fecaca">Noise Floor (jarak x km)</text>
  </g>

  <!-- Axis Labels -->
  <text x="36" y="180" text-anchor="middle" transform="rotate(-90 36 180)" font-size="10.5" font-weight="700" fill="#cbd5e1">Daya Pantul Relatif (dB)</text>
  <text x="396" y="309" text-anchor="middle" font-size="10.5" font-weight="700" fill="#cbd5e1">Jarak Sepanjang Kabel (km) — d = (c · t) / (2 · n)</text>

  <!-- Bottom Reference Legend -->
  <rect x="64" y="322" width="664" height="52" rx="8" fill="#1e293b"/>
  <text x="80" y="343" font-size="10" fill="#e2e8f0"><tspan font-weight="800" fill="#38bdf8">Rayleigh Backscatter:</tspan> Lereng turun rata (dB/km) · <tspan font-weight="800" fill="#fde047">Gainer:</tspan> Tangga naik palsu (uji 2 arah!) · <tspan font-weight="800" fill="#34d399">Ekspor:</tspan> Format .SOR (SR-4731)</text>
  <text x="80" y="361" font-size="10" fill="#94a3b8">Atur Pulse Width pendek (5–20 ns) untuk resolusi dekat; panjang (1–10 µs) untuk tembus jarak jauh / splitter.</text>
</svg>
