<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="330" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Cara Kerja PAT (NAT Overload) — 1 IP Public untuk Banyak PC</text>

  <!-- LAN -->
  <rect x="24" y="58" width="176" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="112" y="80" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1e40af">LAN (IP Private)</text>
  <g font-size="10" font-family="'Fira Code', monospace">
    <rect x="40" y="92" width="144" height="30" rx="8" fill="#3b82f6"/><text x="112" y="111" text-anchor="middle" fill="#fff" font-weight="700">192.168.1.2:1025</text>
    <rect x="40" y="130" width="144" height="30" rx="8" fill="#22c55e"/><text x="112" y="149" text-anchor="middle" fill="#fff" font-weight="700">192.168.1.3:1026</text>
    <rect x="40" y="168" width="144" height="30" rx="8" fill="#a855f7"/><text x="112" y="187" text-anchor="middle" fill="#fff" font-weight="700">192.168.1.4:1027</text>
  </g>

  <!-- Router NAT -->
  <rect x="248" y="86" width="150" height="94" rx="14" fill="#1e40af"/>
  <text x="323" y="114" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">Router NAT</text>
  <text x="323" y="134" text-anchor="middle" font-size="9.5" fill="#bfdbfe">ip nat inside source</text>
  <text x="323" y="149" text-anchor="middle" font-size="9.5" fill="#bfdbfe">list 1 int g0/1 overload</text>
  <rect x="262" y="158" width="122" height="16" rx="6" fill="#fbbf24"/>
  <text x="323" y="170" text-anchor="middle" font-size="9" font-weight="800" fill="#7c2d12">PORT TRANSLATION</text>

  <!-- arrows -->
  <path d="M204 133 h38" stroke="#94a3b8" stroke-width="2.5"/><path d="M246 133 l-9 -5 v10 z" fill="#94a3b8"/>
  <path d="M404 133 h38" stroke="#94a3b8" stroke-width="2.5"/><path d="M446 133 l-9 -5 v10 z" fill="#94a3b8"/>

  <!-- Internet -->
  <path d="M500 60 q-18 0 -18 20 q-22 4 -16 24 q4 16 26 16 h76 q22 0 26 -16 q6 -20 -16 -24 q0 -20 -18 -20 z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="540" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">INTERNET</text>
  <text x="620" y="88" text-anchor="middle" font-size="10.5" fill="#334155" font-family="'Fira Code', monospace">8.8.8.8</text>

  <!-- result table -->
  <rect x="24" y="230" width="672" height="76" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="254" font-size="11.5" font-weight="800" fill="#0f172a">Tabel NAT (show ip nat translations):</text>
  <g font-size="10.5" font-family="'Fira Code', monospace" fill="#334155">
    <text x="44" y="278">192.168.1.2:1025 ↔ 203.0.113.1:<tspan font-weight="700" fill="#1d4ed8">50001</tspan></text>
    <text x="264" y="278">192.168.1.3:1026 ↔ 203.0.113.1:<tspan font-weight="700" fill="#15803d">50002</tspan></text>
    <text x="484" y="278">192.168.1.4:1027 ↔ 203.0.113.1:<tspan font-weight="700" fill="#7c3aed">50003</tspan></text>
    <text x="44" y="298" fill="#64748b" font-size="10">Server internet hanya melihat 1 IP: 203.0.113.1 — IP asli PC tersembunyi</text>
  </g>
</svg>
