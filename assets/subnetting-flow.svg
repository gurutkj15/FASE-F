<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="320" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Subnetting: 192.168.1.0/24 dipecah menjadi 4 subnet /26</text>

  <rect x="40" y="54" width="640" height="44" rx="12" fill="#1e40af"/>
  <text x="360" y="81" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">Network 192.168.1.0/24  —  256 alamat  (mask 255.255.255.0)</text>

  <path d="M360 102 v18" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="176" y="122" width="368" height="28" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="141" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Pinjam 2 bit host → 2² = 4 subnet, sisa 6 bit → 2⁶−2 = 62 host/subnet</text>
  <path d="M360 152 v18" stroke="#94a3b8" stroke-width="2.5"/>

  <g font-size="11">
    <rect x="40" y="174" width="150" height="76" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="197" text-anchor="middle" font-weight="800" fill="#1e40af">Subnet 1</text>
    <text x="115" y="217" text-anchor="middle" fill="#334155" font-family="'Fira Code', monospace">.0 – .63</text>
    <text x="115" y="238" text-anchor="middle" font-size="10" fill="#64748b">192.168.1.0/26</text>

    <rect x="203" y="174" width="150" height="76" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="278" y="197" text-anchor="middle" font-weight="800" fill="#15803d">Subnet 2</text>
    <text x="278" y="217" text-anchor="middle" fill="#334155" font-family="'Fira Code', monospace">.64 – .127</text>
    <text x="278" y="238" text-anchor="middle" font-size="10" fill="#64748b">192.168.1.64/26</text>

    <rect x="366" y="174" width="150" height="76" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="441" y="197" text-anchor="middle" font-weight="800" fill="#6d28d9">Subnet 3</text>
    <text x="441" y="217" text-anchor="middle" fill="#334155" font-family="'Fira Code', monospace">.128 – .191</text>
    <text x="441" y="238" text-anchor="middle" font-size="10" fill="#64748b">192.168.1.128/26</text>

    <rect x="529" y="174" width="151" height="76" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="604" y="197" text-anchor="middle" font-weight="800" fill="#b91c1c">Subnet 4</text>
    <text x="604" y="217" text-anchor="middle" fill="#334155" font-family="'Fira Code', monospace">.192 – .255</text>
    <text x="604" y="238" text-anchor="middle" font-size="10" fill="#64748b">192.168.1.192/26</text>
  </g>

  <rect x="40" y="264" width="640" height="40" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="289" text-anchor="middle" font-size="11" fill="#475569">Block size = 256 − 192 = <tspan font-weight="800" fill="#1d4ed8">64</tspan>  →  alamat pertama tiap subnet berjarak 64</text>
</svg>
