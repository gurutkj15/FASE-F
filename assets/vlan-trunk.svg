<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="320" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#6d28d9">Access Port (untagged) vs Trunk Port (tagged 802.1Q)</text>

  <!-- Switch A -->
  <rect x="60" y="126" width="200" height="58" rx="14" fill="#1e293b"/>
  <text x="160" y="150" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">Switch A</text>
  <text x="160" y="170" text-anchor="middle" font-size="10" fill="#94a3b8">VLAN 10 Guru | VLAN 20 Siswa</text>
  <!-- Switch B -->
  <rect x="460" y="126" width="200" height="58" rx="14" fill="#1e293b"/>
  <text x="560" y="150" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">Switch B</text>
  <text x="560" y="170" text-anchor="middle" font-size="10" fill="#94a3b8">VLAN 10 Guru | VLAN 20 Siswa</text>

  <!-- Trunk -->
  <line x1="260" y1="155" x2="460" y2="155" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
  <rect x="304" y="108" width="112" height="34" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="360" y="130" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">TRUNK (tagged)</text>
  <rect x="304" y="170" width="112" height="30" rx="9" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="360" y="189" text-anchor="middle" font-size="9.5" font-family="'Fira Code', monospace" fill="#6d28d9">[802.1Q|VID 10] + Data</text>
  <text x="360" y="222" text-anchor="middle" font-size="10" fill="#64748b">1 kabel membawa SEMUA VLAN</text>

  <!-- PCs left -->
  <g font-size="10" font-weight="700">
    <rect x="40" y="236" width="86" height="34" rx="10" fill="#3b82f6"/><text x="83" y="258" text-anchor="middle" fill="#fff">PC VLAN 10</text>
    <rect x="196" y="236" width="86" height="34" rx="10" fill="#22c55e"/><text x="239" y="258" text-anchor="middle" fill="#fff">PC VLAN 20</text>
    <rect x="500" y="236" width="86" height="34" rx="10" fill="#3b82f6"/><text x="543" y="258" text-anchor="middle" fill="#fff">PC VLAN 10</text>
    <rect x="600" y="236" width="86" height="34" rx="10" fill="#22c55e"/><text x="643" y="258" text-anchor="middle" fill="#fff">PC VLAN 20</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="83" y1="236" x2="110" y2="184"/><line x1="239" y1="236" x2="215" y2="184"/>
    <line x1="543" y1="236" x2="515" y2="184"/><line x1="643" y1="236" x2="610" y2="184"/>
  </g>
  <text x="83" y="292" text-anchor="middle" font-size="9.5" fill="#3b82f6" font-weight="700">ACCESS — tanpa tag</text>
  <text x="239" y="292" text-anchor="middle" font-size="9.5" fill="#16a34a" font-weight="700">ACCESS — tanpa tag</text>
  <text x="543" y="292" text-anchor="middle" font-size="9.5" fill="#3b82f6" font-weight="700">ACCESS — tanpa tag</text>
  <text x="643" y="292" text-anchor="middle" font-size="9.5" fill="#16a34a" font-weight="700">ACCESS — tanpa tag</text>
  <text x="360" y="308" text-anchor="middle" font-size="10.5" fill="#64748b">Frame VLAN 10 &amp; 20 dari Switch A diteruskan utuh ke Switch B lewat trunk</text>
</svg>
