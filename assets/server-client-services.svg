<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="300" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#c2410c">Client – Server: Layanan &amp; Portnya</text>

  <!-- client -->
  <g>
    <rect x="40" y="96" width="130" height="90" rx="16" fill="#1e40af"/>
    <rect x="56" y="112" width="98" height="46" rx="8" fill="#93c5fd"/>
    <text x="105" y="140" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">PC SISWA</text>
    <rect x="76" y="164" width="58" height="8" rx="4" fill="#bfdbfe"/>
    <text x="105" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">meminta layanan</text>
  </g>
  <path d="M180 141 h74" stroke="#94a3b8" stroke-width="3"/>
  <path d="M258 141 l-10 -6 v12 z" fill="#94a3b8"/>
  <text x="217" y="130" text-anchor="middle" font-size="9.5" fill="#64748b">request</text>

  <!-- server rack -->
  <rect x="270" y="52" width="410" height="196" rx="18" fill="#0f172a"/>
  <text x="475" y="78" text-anchor="middle" font-size="13" font-weight="800" fill="#fbbf24">SERVER (Ubuntu/Linux)</text>
  <g font-size="11" font-weight="700">
    <rect x="292" y="92" width="176" height="34" rx="9" fill="#1e40af"/>
    <text x="380" y="114" text-anchor="middle" fill="#fff">🌐 Web — Apache/Nginx</text>
    <rect x="486" y="92" width="176" height="34" rx="9" fill="#15803d"/>
    <text x="574" y="114" text-anchor="middle" fill="#fff">📖 DNS — BIND9</text>

    <rect x="292" y="134" width="176" height="34" rx="9" fill="#7c3aed"/>
    <text x="380" y="156" text-anchor="middle" fill="#fff">📦 DHCP — isc-dhcp</text>
    <rect x="486" y="134" width="176" height="34" rx="9" fill="#0891b2"/>
    <text x="574" y="156" text-anchor="middle" fill="#fff">📁 FTP — vsftpd</text>

    <rect x="292" y="176" width="176" height="34" rx="9" fill="#db2777"/>
    <text x="380" y="198" text-anchor="middle" fill="#fff">⏰ NTP — chrony/ntp</text>
    <rect x="486" y="176" width="176" height="34" rx="9" fill="#ea580c"/>
    <text x="574" y="198" text-anchor="middle" fill="#fff">🔒 SSH — OpenSSH</text>
  </g>
  <text x="475" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">systemctl status • journalctl -u &lt;service&gt; -f</text>

  <!-- ports -->
  <g font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" fill="#334155">
    <rect x="40" y="248" width="96" height="30" rx="9" fill="#dbeafe"/><text x="88" y="267" font-weight="700" fill="#1d4ed8">:80/:443</text>
    <rect x="146" y="248" width="80" height="30" rx="9" fill="#dcfce7"/><text x="186" y="267" font-weight="700" fill="#15803d">:53</text>
    <rect x="236" y="248" width="96" height="30" rx="9" fill="#ede9fe"/><text x="284" y="267" font-weight="700" fill="#6d28d9">:67/:68</text>
    <rect x="342" y="248" width="76" height="30" rx="9" fill="#ecfeff"/><text x="380" y="267" font-weight="700" fill="#0e7490">:21</text>
    <rect x="428" y="248" width="76" height="30" rx="9" fill="#fce7f3"/><text x="466" y="267" font-weight="700" fill="#be185d">:123</text>
    <rect x="514" y="248" width="76" height="30" rx="9" fill="#ffedd5"/><text x="552" y="267" font-weight="700" fill="#c2410c">:22</text>
    <rect x="600" y="248" width="80" height="30" rx="9" fill="#fee2e2"/><text x="640" y="267" font-weight="700" fill="#b91c1c">:25</text>
  </g>
</svg>
