<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="310" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">Posisi Firewall, DMZ &amp; Jaringan Internal</text>

  <!-- internet -->
  <path d="M40 66 q-16 0 -16 18 q-20 4 -14 22 q4 14 24 14 h70 q20 0 24 -14 q6 -18 -14 -22 q0 -18 -16 -18 z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="104" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">INTERNET</text>

  <!-- firewall -->
  <rect x="188" y="58" width="70" height="120" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <g fill="#ef4444" opacity="0.85">
    <rect x="196" y="66" width="26" height="18" rx="4"/><rect x="226" y="66" width="26" height="18" rx="4"/>
    <rect x="211" y="88" width="26" height="18" rx="4"/><rect x="196" y="110" width="26" height="18" rx="4"/>
    <rect x="226" y="110" width="26" height="18" rx="4"/><rect x="211" y="132" width="26" height="18" rx="4"/>
    <rect x="196" y="154" width="26" height="18" rx="4"/><rect x="226" y="154" width="26" height="18" rx="4"/>
  </g>
  <text x="223" y="196" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b91c1c">FIREWALL</text>
  <text x="223" y="212" text-anchor="middle" font-size="9.5" fill="#64748b">aturan ACL / stateful</text>

  <!-- DMZ -->
  <rect x="300" y="58" width="176" height="120" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="388" y="82" text-anchor="middle" font-size="11.5" font-weight="800" fill="#b45309">DMZ</text>
  <g font-size="10" font-weight="700">
    <rect x="316" y="94" width="144" height="26" rx="8" fill="#fff7ed"/><text x="388" y="111" text-anchor="middle" fill="#c2410c">Web Server :80/:443</text>
    <rect x="316" y="126" width="144" height="26" rx="8" fill="#fff7ed"/><text x="388" y="143" text-anchor="middle" fill="#c2410c">Mail Server :25/:587</text>
  </g>

  <!-- LAN -->
  <rect x="516" y="58" width="180" height="120" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="606" y="82" text-anchor="middle" font-size="11.5" font-weight="800" fill="#15803d">INTERNAL LAN</text>
  <g font-size="10" font-weight="700">
    <rect x="532" y="94" width="148" height="26" rx="8" fill="#f0fdf4"/><text x="606" y="111" text-anchor="middle" fill="#166534">PC Siswa / Guru</text>
    <rect x="532" y="126" width="148" height="26" rx="8" fill="#f0fdf4"/><text x="606" y="143" text-anchor="middle" fill="#166534">File &amp; DB Server</text>
  </g>

  <!-- arrows -->
  <path d="M118 100 h62" stroke="#22c55e" stroke-width="3"/><path d="M184 100 l-9 -5 v10 z" fill="#22c55e"/>
  <path d="M266 100 h26" stroke="#22c55e" stroke-width="3"/><path d="M296 100 l-9 -5 v10 z" fill="#22c55e"/>
  <path d="M480 100 h26" stroke="#22c55e" stroke-width="3"/><path d="M510 100 l-9 -5 v10 z" fill="#22c55e"/>
  <path d="M696 160 h14 q10 0 10 -10 v-70 q0 -10 -10 -10 h-14" stroke="#ef4444" stroke-width="3" fill="none" stroke-dasharray="7,5"/>
  <text x="360" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">LAN boleh akses DMZ &amp; Internet  •  Internet HANYA boleh ke DMZ (tidak langsung ke LAN)</text>
  <rect x="60" y="272" width="600" height="26" rx="9" fill="#fee2e2"/>
  <text x="360" y="290" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Jika web server di DMZ dibobol, data internal LAN tetap terlindungi firewall</text>
</svg>
