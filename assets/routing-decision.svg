<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="720" height="320" rx="22" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Keputusan Router &amp; Administrative Distance (AD)</text>

  <!-- packet in -->
  <rect x="30" y="60" width="96" height="34" rx="10" fill="#fbbf24"/>
  <text x="78" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#7c2d12">PAKET masuk</text>
  <path d="M130 77 h30" stroke="#94a3b8" stroke-width="2.5"/><path d="M164 77 l-9 -5 v10 z" fill="#94a3b8"/>

  <!-- router -->
  <circle cx="220" cy="77" r="34" fill="#1e40af"/>
  <text x="220" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">R1</text>
  <text x="220" y="90" text-anchor="middle" font-size="8.5" fill="#bfdbfe">router</text>

  <path d="M254 77 h40" stroke="#94a3b8" stroke-width="2.5"/><path d="M298 77 l-9 -5 v10 z" fill="#94a3b8"/>

  <!-- decision -->
  <path d="M370 47 L430 77 L370 107 L310 77 Z" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="370" y="73" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Cocok dengan</text>
  <text x="370" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">routing table?</text>

  <!-- AD ranking -->
  <text x="545" y="46" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155">Urutan kepercayaan (AD)</text>
  <g font-size="10.5" font-weight="700">
    <rect x="452" y="56" width="186" height="26" rx="8" fill="#dcfce7"/><text x="545" y="73" text-anchor="middle" fill="#15803d">C Connected — AD 0</text>
    <rect x="452" y="88" width="186" height="26" rx="8" fill="#d1fae5"/><text x="545" y="105" text-anchor="middle" fill="#047857">L Local — AD 0</text>
    <rect x="452" y="120" width="186" height="26" rx="8" fill="#dbeafe"/><text x="545" y="137" text-anchor="middle" fill="#1d4ed8">S Static — AD 1</text>
    <rect x="452" y="152" width="186" height="26" rx="8" fill="#fef3c7"/><text x="545" y="169" text-anchor="middle" fill="#b45309">O OSPF — AD 110</text>
    <rect x="452" y="184" width="186" height="26" rx="8" fill="#ffedd5"/><text x="545" y="201" text-anchor="middle" fill="#c2410c">R RIP — AD 120</text>
    <rect x="452" y="216" width="186" height="26" rx="8" fill="#fee2e2"/><text x="545" y="233" text-anchor="middle" fill="#b91c1c">S* Default — AD 1</text>
  </g>

  <!-- outcomes -->
  <rect x="310" y="140" width="120" height="52" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="162" text-anchor="middle" font-size="11" font-weight="800" fill="#1e40af">YA → kirim ke</text>
  <text x="370" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#1e40af">next-hop terbaik</text>

  <rect x="310" y="212" width="120" height="46" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="370" y="232" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">TIDAK →</text>
  <text x="370" y="249" text-anchor="middle" font-size="10.5" fill="#b91c1c">pakai default route / DROP</text>
  <path d="M370 107 v30" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M370 194 v15" stroke="#8b5cf6" stroke-width="2"/>

  <rect x="30" y="266" width="400" height="38" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="230" y="290" text-anchor="middle" font-size="10.5" fill="#475569">Rute dengan <tspan font-weight="800" fill="#1d4ed8">AD paling kecil</tspan> yang menang → masuk routing table</text>
</svg>
